name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Verify tag matches package version
        run: |
          PKG_TAG="v$(node -p "require('./package.json').version")"
          if [ "$PKG_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($PKG_TAG)."
            echo "::error::Run 'pnpm version:set <version>', commit, then tag the release commit."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm build
      - run: pnpm test:artifact

      - name: Pack tarball
        id: pack
        run: |
          pnpm pack --pack-destination dist
          echo "tarball=$(ls dist/*.tgz)" >> "$GITHUB_OUTPUT"

      # Trusted publishing needs npm >= 11.5.1; Node 22.x ships npm 10.
      - name: Install npm CLI with trusted publishing support
        run: npm install --global npm@^11.5.1

      # First release authenticates with the NPM_TOKEN secret, because npm can
      # only be bound to a trusted publisher after the package exists.
      # Once that binding is configured and NPM_TOKEN is deleted, the same step
      # publishes through OIDC (GitHub id-token) with no stored credential.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "::notice title=npm auth::Publishing with the NPM_TOKEN secret."
            npm_config_userconfig="$RUNNER_TEMP/npmrc"
            export npm_config_userconfig
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$npm_config_userconfig"
          else
            echo "::notice title=npm auth::No NPM_TOKEN secret; publishing with npm trusted publishing (OIDC)."
          fi
          npm publish "$TARBALL" --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            dist/*.tgz
